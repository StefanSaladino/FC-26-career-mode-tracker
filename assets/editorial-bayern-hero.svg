<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Floodlit European night editorial graphic</title>
  <desc id="d">Abstract floodlit stadium atmosphere in Napoli blue and deep navy, designed as a clean background for the Bayern lead story.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a13"/>
      <stop offset="0.58" stop-color="#081a2d"/>
      <stop offset="1" stop-color="#0d2947"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#bcecff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fd3f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4b3e"/>
      <stop offset="1" stop-color="#062d27"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="230" cy="110" r="210" fill="url(#light)"/>
  <circle cx="1370" cy="105" r="220" fill="url(#light)"/>
  <path d="M0 520 Q800 350 1600 520 V900 H0Z" fill="#030b14"/>
  <path d="M0 625 Q800 460 1600 625 V900 H0Z" fill="url(#pitch)"/>
  <path d="M250 900 L600 570 H1000 L1350 900Z" fill="#0a5a48" opacity="0.72"/>
  <path d="M515 900 L700 570 M1085 900 L900 570" stroke="#d9f3ff" stroke-width="5" opacity="0.38"/>
  <path d="M800 570 V900" stroke="#d9f3ff" stroke-width="5" opacity="0.28"/>
  <ellipse cx="800" cy="765" rx="160" ry="78" fill="none" stroke="#d9f3ff" stroke-width="5" opacity="0.30"/>
  <path d="M90 555 Q800 405 1510 555" fill="none" stroke="#0072ce" stroke-width="12" opacity="0.9"/>
  <path d="M130 510 Q800 380 1470 510" fill="none" stroke="#8fd3f4" stroke-width="3" opacity="0.55"/>
  <g opacity="0.65" fill="#d8ecf7">
    <circle cx="200" cy="500" r="4"/><circle cx="260" cy="490" r="4"/><circle cx="330" cy="478" r="4"/>
    <circle cx="1260" cy="482" r="4"/><circle cx="1330" cy="493" r="4"/><circle cx="1400" cy="505" r="4"/>
  </g>
