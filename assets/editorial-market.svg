<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Transfer market drama graphic</title><desc id="d">A newspaper-inspired transfer graphic about Napoli rejecting major bids.</desc><rect width="1600" height="900" fill="#f7f9fb"/><rect x="0" y="0" width="1600" height="105" fill="#0b2340"/><text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" fill="#fff" letter-spacing="4">MERCATO EXTRA</text><line x1="90" y1="190" x2="1510" y2="190" stroke="#0b2340" stroke-width="8"/><text x="95" y="325" font-family="Arial,Helvetica,sans-serif" font-size="88" font-weight="900" fill="#0b2340">€? NO.</text><text x="95" y="455" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="900" fill="#0072ce">NAPOLI SHUT THE DOOR</text><text x="100" y="555" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#425466">BEIER · PIO · DI LORENZO</text><text x="100" y="625" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#64748b">Three giant offers. Three refusals. One message to Europe.</text><rect x="1060" y="285" width="350" height="250" fill="#e9f4fc" stroke="#0072ce" stroke-width="4" transform="rotate(-5 1235 410)"/><text x="1125" y="420" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="900" fill="#0b2340" transform="rotate(-5 1235 410)">REJECTED</text></svg>