<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Napoli 3-2 Pisa late winner feature</title><desc id="d">A scoreboard-inspired graphic marking Federico Chiesa's 80th minute winner.</desc><rect width="1600" height="900" fill="#0b2340"/><rect x="80" y="80" width="1440" height="740" fill="#101f33" stroke="#8fd3f4" stroke-width="3"/><text x="130" y="185" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#8fd3f4" letter-spacing="8">FULL TIME</text><text x="130" y="380" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" fill="#fff">NAPOLI</text><text x="130" y="510" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" fill="#fff">PISA</text><text x="1160" y="380" font-family="Arial,Helvetica,sans-serif" font-size="122" font-weight="900" fill="#8fd3f4">3</text><text x="1160" y="510" font-family="Arial,Helvetica,sans-serif" font-size="122" font-weight="900" fill="#fff">2</text><line x1="1010" y1="260" x2="1010" y2="590" stroke="#30455e" stroke-width="3"/><text x="130" y="690" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" fill="#0072ce">80' CHIESA</text><text x="130" y="755" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#d7e4ef" letter-spacing="3">CHAOS. PANIC. THEN A THUNDERBOLT.</text></svg>