name: Article Image Audit

on:
  push:
    branches:
      - main
    paths:
      - data.js
      - site-overrides.js
      - image-fixes.js
      - assets/**
      - scripts/image-audit.mjs
      - .github/workflows/image-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify article images
        run: node scripts/image-audit.mjs
