name: Build compact public season room
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legacy-index.html'
      - 'snapshot-runtime.js'
      - 'scripts/build-static-snapshot.mjs'
      - '.github/workflows/build-static-snapshot.yml'
      - 'stories-*.js'
      - 'site-visible-*.js'
      - 'state-*.js'
      - 'post-*.js'
      - 'comments*.js'
      - 'data.js'
      - 'app.js'
permissions:
  contents: write
concurrency:
  group: static-snapshot-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build-time browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compile all historical records into one snapshot and run browser tests
        run: node scripts/build-static-snapshot.mjs
      - name: Commit compiled public site
        run: |
          git config user.name "season-room-build[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html snapshot-data.js news-archive.json snapshot-build-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Compile compact season room edition [skip ci]"
            git push origin HEAD:main
          fi
