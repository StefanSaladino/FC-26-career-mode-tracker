name: Supporter Comments Audit

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'data.js'
      - 'post-*.js'
      - 'comments*.js'
      - 'scripts/comment-audit.mjs'
      - '.github/workflows/comment-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comments-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check all article comment sources, replies and syntax
        run: node scripts/comment-audit.mjs
